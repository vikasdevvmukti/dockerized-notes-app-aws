# Nginx reverse proxy configuration for the Dockerized Notes App
# Place at: /etc/nginx/sites-available/notes-app
# Enable with: sudo ln -s /etc/nginx/sites-available/notes-app /etc/nginx/sites-enabled/
#
# After running Certbot (sudo certbot --nginx -d your-subdomain.duckdns.org),
# this file will be automatically updated to include SSL configuration
# and an HTTP -> HTTPS redirect block.

server {
    listen 80;
    server_name your-subdomain.duckdns.org;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
